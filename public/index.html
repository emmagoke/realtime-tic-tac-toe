<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>

        <div id="lobby">
            <button class="btn btn-primary" id="createBtn">Create Game</button>
            <div style="margin: 20px 0;">or</div>
            <input id="codeInput" placeholder="Enter code" maxlength="4"
                style="padding:12px;border-radius:25px;border:none;text-transform:uppercase;text-align:center;">
            <button class="btn btn-secondary" id="joinBtn">Join</button>

            <div style="margin-top:30px; text-align:left;">
                <h3 style="margin-bottom:10px;">My games</h3>
                <div id="historyList"></div>
            </div>
        </div>


        <div id="replayArea" style="display:none;">
            <div id="replayInfo" style="margin-bottom:15px;color:#aaa;"></div>
            <div class="game-board" id="replayBoard" style="pointer-events:none;">
                <button class="ceil" disabled></button>
                <button class="ceil" disabled></button>
                <button class="ceil" disabled></button>
                <button class="ceil" disabled></button>
                <button class="ceil" disabled></button>
                <button class="ceil" disabled></button>
                <button class="ceil" disabled></button>
                <button class="ceil" disabled></button>
                <button class="ceil" disabled></button>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" id="replayPrev">Prev</button>
                <button class="btn btn-primary" id="replayPlay">Play</button>
                <button class="btn btn-secondary" id="replayNext">Next</button>
            </div>
            <div class="controls">
                <select id="replayRound" style="padding:10px;border-radius:25px;"></select>
                <button class="btn btn-secondary" id="replayClose">Close</button>
            </div>
        </div>
       

        <div id="gameArea" style="display:none;">
            <div id="roomInfo" style="margin-bottom:15px;color:#aaa;"></div>

            <!-- Old Code -->
            <div class="game-info">
                <div class="current-player" id="currentPlayer">Player x's Turn</div>
             </div>


            <div class="game-board" id="gameBoard">
                <button class="ceil" data-index="0"></button>
                <button class="ceil" data-index="1"></button>
                <button class="ceil" data-index="2"></button>
                <button class="ceil" data-index="3"></button>
                <button class="ceil" data-index="4"></button>
                <button class="ceil" data-index="5"></button>
                <button class="ceil" data-index="6"></button>
                <button class="ceil" data-index="7"></button>
                <button class="ceil" data-index="8"></button>
            </div>

            <div class="game-status" id="gameStatus"></div>

            <div class="controls">
                <button class="btn btn-primary" id="resetBtn">New Game</button>
                <button class="btn btn-secondary" id="resetScoreBtn">Reset Score</button>
                <button class="btn btn-secondary" id="leaveBtn">Leave</button>

            </div>

            <div class="score-board">
                <div class="score x">
                    <div class="score-label">Player X</div>
                    <div class="score-value" id="scoreX">0</div>
                </div>

                <div class="score tie">
                    <div class="score-label">Tie</div>
                    <div class="score-value" id="scoreTie">0</div>
                </div>

                <div class="score o">
                    <div class="score-label">Player X</div>
                    <div class="score-value" id="scoreO">0</div>
                </div>
            </div>
            <!-- Old Code -->
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
